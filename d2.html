<!DOCTYPE html>
<html>
<head>
  <title>Vowels and Consonants</title>
</head>
<body>

  <h2>Vowels and Consonants</h2>

  <input type="text" id="text" placeholder="Enter a string">
  <button onclick="run()">Run</button>

  <pre id="output"></pre>

  <script>
    function vowelsAndConsonants(s) {
      const vowels = s.match(/[aeiou]/g) || [];
      const consonants = s.match(/[^aeiou]/g) || [];

      let result = "";

      for (let letters of [vowels, consonants]) {
        for (let letter of letters) {
          result += letter + "\n";
        }
      }

      document.getElementById("output").textContent = result;
    }

    function run() {
      const input = document.getElementById("text").value.toLowerCase();
      vowelsAndConsonants(input);
    }
  </script>

</body>
</html>
