<!DOCTYPE html>
<html>
<head>
  <title>Regex Vowel Match</title>
</head>
<body>

  <h2>Start & End with Same Vowel</h2>

  <input type="text" id="text" placeholder="Enter a string">
  <button onclick="check()">Check</button>

  <p id="result"></p>

  <script>
    function regexVar(str) {
      const re = /^([aeiou]).*\1$/;
      return re.test(str);
    }

    function check() {
      const value = document.getElementById("text").value.toLowerCase();
      const output = regexVar(value);
      document.getElementById("result").textContent =
        "Result: " + output;
    }
  </script>

</body>
</html>
