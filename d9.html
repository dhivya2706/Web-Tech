<!DOCTYPE html>
<html>
<head>
  <title>Rectangle Object</title>
</head>
<body>

  <h2>Rectangle Details</h2>

  <button onclick="run()">Create Rectangle</button>

  <p id="output"></p>

  <script>
    function Rectangle(a, b) {
      this.length = a;
      this.width = b;
      this.perimeter = 2 * (a + b);
      this.area = a * b;
    }

    function run() {
      const rect = new Rectangle(4, 5);

      document.getElementById("output").innerHTML =
        "Length: " + rect.length + "<br>" +
        "Width: " + rect.width + "<br>" +
        "Perimeter: " + rect.perimeter + "<br>" +
        "Area: " + rect.area;
    }
  </script>

</body>
</html>
